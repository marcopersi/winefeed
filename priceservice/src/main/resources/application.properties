spring.application.name=priceservice
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/winefeed
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway versioned migrations in classpath:db/migration
spring.flyway.enabled=true

# Comma-separated list of staging Excel files to import on startup.
# Leave empty to skip import. Example: /path/a.xlsx,/path/b.xlsx
priceservice.import.files=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
