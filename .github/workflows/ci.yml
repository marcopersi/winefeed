---
# CI Workflow - konsolidiert Lint, Build und Security Checks
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          # STANDARD (no semicolons, single quotes) conflicts with the
          # actual, consistently-used house style across price-service-ui
          # (semicolons, double quotes) -- discovered while fixing #119,
          # since no prior commit touching these files had ever actually
          # run through this Lint job (confirmed via the GitHub API: zero
          # check-runs existed for the commits that introduced them).
          # Omitted (not set to false: super-linter rejects mixing
          # explicit true/false VALIDATE_* values in one run). Prettier,
          # which agrees with the real style, stays enabled.
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_PYTHON_PYLINT: true
          FILTER_REGEX_EXCLUDE: ".*archive/.*|.*price-service-ui/dist/.*"
          DEFAULT_BRANCH: "master"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build all subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: price-service-ui/package-lock.json

      - name: Build PersiCommons, VinoDomain, VinoImporter, priceservice
        run: ./gradlew build

      - name: Build price-service-ui
        run: |
          rm -f price-service-ui/package-lock.json
          npm install --prefix price-service-ui
          npm run build --prefix price-service-ui

  test-data:
    name: Test wine resolution pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        run: pip install -r data/requirements.txt

      - name: Test wine resolution
        run: python -m unittest discover -s data/tests -v

      - name: Test ingest fetchers
        run: python -m unittest discover -s ingest/tests -v