---
# Monthly ingest: fetch new auction results for every fetchable house, persist
# the manifest (for incremental dedup) and the cumulative archive as artifacts
# for the process workflow.
#
# The archive is cumulative: the previous archive artifact is downloaded first,
# new auctions are added to it, and the combined archive is re-uploaded. This
# keeps the process workflow able to rebuild the full DB from scratch.
#
# Sothebys and idealwine are deliberately not covered here:
# - sothebys needs camoufox + a residential IP (runs locally only);
# - idealwine runs via run_idealwine_delta.py (direct DB append).
name: Ingest

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch new auctions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Download previous archive
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ingest.yml
          name: auction-archive
          path: ${{ runner.temp }}/archive
          if_no_artifact_found: warn

      - name: Fetch new auctions
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/archive
          MANIFEST_PATH: ${{ github.workspace }}/data/ingest_manifest.json
          PANDOLFINI_USER: ${{ secrets.PANDOLFINI_USER }}
          PANDOLFINI_PWD: ${{ secrets.PANDOLFINI_PWD }}
          FINARTE_USER: ${{ secrets.FINARTE_USER }}
          FINARTE_PWD: ${{ secrets.FINARTE_PWD }}
        run: python data/run_ingest.py --only steinfels,weinboerse,weinauktionator,hdh,koppe,langtons,winefields,dorotheum,pandolfini,finarte,besch-cannes,dobiaschofsky,christies

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ingest_manifest.json
          if git diff --cached --quiet; then
            echo "No manifest change."
          else
            git commit -m "chore(ingest): update ingest manifest"
            git push
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: auction-archive
          path: ${{ runner.temp }}/archive
          if-no-files-found: ignore
