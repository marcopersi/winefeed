---
# Manual live smoke test for the Sothebys fetcher.
#
# Sothebys uses Cloudflare Turnstile on its login, which only camoufox (a
# patched Firefox) can solve. This workflow installs camoufox and the Firefox
# system libraries, then runs the full chain: login -> discover -> GraphQL
# fetch with hammer prices. Triggered manually because the camoufox browser
# download is large and the login is rate-limited.
name: Sothebys live fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    name: camoufox login + GraphQL fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camoufox + Firefox system deps
        run: |
          pip install -r data/requirements.txt camoufox
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libxt6 libx11-xcb1 libasound2t64 \
            libdrm2 libgbm1 libxcomposite1 libxcursor1 libxdamage1 \
            libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libpango-1.0-0 libpangocairo-1.0-0 libxkbcommon0 libxshmfence1 \
            libegl1 libgl1-mesa-dri fonts-liberation fontconfig ca-certificates \
            xvfb
          python -m camoufox fetch

      - name: Run Sothebys live test
        env:
          SOTHEBYS_USER: ${{ secrets.SOTHEBYS_USER }}
          SOTHEBYS_PWD: ${{ secrets.SOTHEBYS_PWD }}
          SOTHEBYS_HEADLESS: "0"
          SOTHEBYS_DEBUG_DIR: /tmp/sothebys-debug
        run: xvfb-run -a python data/live_test_sothebys.py

      - name: Upload login debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sothebys-login-debug
          path: /tmp/sothebys-debug
